
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard">
        <header class="header">
            <div class="brand">
                <span class="brand-icon">☀</span>
                <h1>Weatherly</h1>
            </div>
            <p>Know your weather, plan your day.</p>
        </header>

        <section class="search-section">
            <form id="searchForm">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="searchBtn">Search</button>
            </form>
            <p id="message" class="message" aria-live="polite"></p>
        </section>

        <section id="weatherContent" hidden>
            <div class="current-weather">
                <div class="current-info">
                    <p class="location-label">CURRENT WEATHER</p>
                    <h2 id="cityName">--</h2>
                    <p id="currentDate">--</p>
                    <div class="temperature">
                        <span id="weatherIcon">☀️</span>
                        <span id="temperature">--°</span>
                    </div>
                    <p id="weatherDescription">--</p>
                    <p id="feelsLike">Feels like --°</p>
                </div>

                <div class="weather-details">
                    <div class="detail-card">
                        <span>💧</span>
                        <div>
                            <p>Humidity</p>
                            <h3 id="humidity">--%</h3>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span>🌬️</span>
                        <div>
                            <p>Wind Speed</p>
                            <h3 id="windSpeed">-- km/h</h3>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span>🌧️</span>
                        <div>
                            <p>Precipitation</p>
                            <h3 id="precipitation">-- mm</h3>
                        </div>
                    </div>
                    <div class="detail-card">
                        <span>☁️</span>
                        <div>
                            <p>Cloud Cover</p>
                            <h3 id="cloudCover">--%</h3>
                        </div>
                    </div>
                </div>
            </div>

            <section class="forecast-section">
                <h2>Hourly Forecast</h2>
                <div id="hourlyForecast" class="hourly-list"></div>
            </section>

            <section class="forecast-section">
                <h2>7-Day Forecast</h2>
                <div id="dailyForecast" class="daily-list"></div>
            </section>
        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
