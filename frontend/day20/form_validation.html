<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      color: red;
    }
  </style>
</head>
<body>
  
  <input type="text" id="inp1">
  <p id="error1"></p>
  <br>
  <br>
  <br>
  
  <input type="number" id="inp2" placeholder="enter a number">
  <p id="error2"></p>
  <button onclick="handleSubmit()">submit</button>

  <script>
    function handleSubmit() {
      let inp1 = document.getElementById('inp1');
      let inp2 = document.getElementById('inp2');

      if (inp1.value.trim() === '') {
        document.getElementById('error1').innerHTML = 'please fill this field'
        inp1.style.border = "4px solid red"
      } else {
        document.getElementById('error').innerHTML = ''
        inp1.style.border = "4px solid green"
      }

      if (inp2.value.trim() === '' ||  inp2.value <= 0) {
        document.getElementById('error2').innerHTML = 'please enter a number greater then 0'
        inp2.style.border = "4px solid red"
      } else {
        document.getElementById('error').innerHTML = ''
        inp2.style.border = "4px solid green"
      }
    }
    
    
  </script>
</body>
</html>
